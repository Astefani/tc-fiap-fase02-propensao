# Decisões de modelagem rastreadas pelo DVC.
#
# Regra: entra aqui o que, mudando, INVALIDA o modelo — o DVC detecta a mudança e
# re-executa os estágios afetados. Configuração de ambiente (URIs, nível de log)
# mora no .env; constantes de domínio (grupos de colunas) moram em config.py.

seed: 42

prepare:
  remover_duplicatas: true
  test_size: 0.2

train:
  # dummy | logreg | random_forest | hist_gradient_boosting
  # Escolhido em 01/09: o RF vence o HistGB em TODAS as métricas do hold-out
  # (PR-AUC 0,374 vs 0,356) — mas só depois de recalibrar o limiar, porque o
  # 0,45 anterior tinha sido calculado para o HistGB. Ver evaluate.limiar.
  # ⚠️ Custo conhecido e aceito: o RF NÃO é reprodutível bit-a-bit entre
  # arquiteturas (x86 0,374091 · ARM 0,376405, mesmo commit e mesmo dvc.lock).
  # O HistGB é. O Dockerfile fixa bibliotecas e sistema, mas não a arquitetura:
  # fechar essa lacuna exigiria `platform: linux/amd64` no compose.
  algoritmo: random_forest

  # PageValues fica FORA do modelo (decisão de 29/08).
  # A documentação do dataset a define como "o valor médio de uma página que o
  # usuário visitou antes de completar uma transação" — ou seja, a variável é
  # construída a partir do desfecho que queremos prever (near-target leakage).
  # Custo medido: PR-AUC cai ~50%. Assumido conscientemente: modelagem vale 10%
  # da nota e um modelo mais fraco é preferível a um número inflado por vazamento.
  usar_page_values: false

  dummy:
    strategy: prior
  logreg:
    C: 1.0
    max_iter: 1000
    class_weight: balanced
  random_forest:
    n_estimators: 400
    min_samples_leaf: 5
    class_weight: balanced_subsample
    n_jobs: -1
  hist_gradient_boosting:
    max_iter: 300
    learning_rate: 0.06
    max_leaf_nodes: 31
    class_weight: balanced

evaluate:
  # Limiar de decisão escolhido por F1 máximo em predições OUT-OF-FOLD
  # (StratifiedKFold, 5 folds) sobre a partição de TREINO — nunca sobre o hold-out,
  # que precisa permanecer intocado para a avaliação final.
  # ⚠️ Recalculado a cada troca de algoritmo ou de hiperparâmetros. Histórico:
  #   hist_gradient_boosting -> 0,45  (em amostra o ótimo aparecia em 0,65, porque
  #       o HistGB memoriza o treino com recall 1,000; out-of-fold cai para 0,45,
  #       com a curva bem plana entre 0,35 e 0,50)
  #   random_forest          -> 0,40  (ótimo 0,41 na grade de 0,01; zona plana
  #       entre 0,39 e 0,43; 0,40 é o ótimo na mesma grade de 0,05 do HistGB)
  # Reproduzir a conta: `python diversos/escolher_limiar.py`
  limiar: 0.40
