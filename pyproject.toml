[project]
name = "tc-fiap-fase02-propensao"
version = "0.1.0"
description = "Propensão de compra em e-commerce — Tech Challenge Fase 02 (Pós Tech ML Engineering, FIAP)"
authors = [{ name = "Alessandro Stefani", email = "stefani.alessandro@gmail.com" }]
requires-python = ">=3.12,<3.13"

# Dependências de produção: é exatamente isto que entra na imagem Docker,
# porque o Dockerfile roda `poetry install --only main`.
# O `dvc` está aqui de propósito — o container executa `dvc repro`.
dependencies = [
    "pandas (>=2.2,<3.0)",
    "numpy (>=2.0,<3.0)",
    "scikit-learn (>=1.6,<2.0)",
    "mlflow (>=3.0,<4.0)",
    "dvc[s3] (>=3.67.1,<4.0.0)",
    "joblib (>=1.4,<2.0)",
    "pyarrow (>=17.0)",
    "pydantic-settings (>=2.5,<3.0)",
    "pyyaml (>=6.0,<7.0)",
]

[tool.poetry]
packages = [{ include = "propensao", from = "src" }]

# Ferramentas de desenvolvimento: ficam FORA da imagem Docker.
[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.9"
ipykernel = "^6.29"
matplotlib = "^3.9"
seaborn = "^0.13"
nbconvert = "^7.17.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
